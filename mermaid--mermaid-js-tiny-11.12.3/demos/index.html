<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid AI Playground</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=" />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --accent: #4f46e5;
        --accent-light: #ede9fe;
        --accent-hover: #4338ca;
        --accent-secondary: #0ea5e9;
        --text: #0f172a;
        --text-dim: #64748b;
        --border: #e2e8f0;
        --header-height: 64px;
        --sidebar-width: 260px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar Styles */
      aside {
        width: var(--sidebar-width);
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        z-index: 20;
        transition: transform 0.3s ease;
        box-shadow: 2px 0 8px rgba(15,23,42,0.06);
      }

      .sidebar-header {
        padding: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border);
      }

      .logo-circle {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: white;
      }

      .sidebar-header h2 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      .nav-section {
        margin-top: 10px;
        padding: 0 12px;
      }

      .nav-label {
        padding: 10px 12px;
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--text-dim);
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .examples-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 20px 12px;
      }

      .example-item {
        padding: 10px 12px;
        display: block;
        text-decoration: none;
        color: var(--text-dim);
        font-size: 0.9rem;
        border-radius: 6px;
        transition: all 0.2s;
        margin-bottom: 2px;
      }

      .example-item:hover {
        background: var(--accent-light);
        color: var(--accent);
      }

      .example-item.active {
        background: var(--accent-light);
        color: var(--accent);
        font-weight: 500;
      }

      /* Main Content Styles */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        position: relative;
      }

      header {
        height: var(--header-height);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        z-index: 100;
        position: relative;
        box-shadow: 0 1px 4px rgba(15,23,42,0.06);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: var(--text);
        font-size: 1.5rem;
        cursor: pointer;
      }

      .ai-prompt-container {
        flex: 1;
        max-width: 600px;
        margin: 0 40px;
        position: relative;
      }

      .ai-prompt-input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 10px 20px 10px 44px;
        color: var(--text);
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .ai-prompt-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
      }

      .ai-prompt-input::placeholder {
        color: var(--text-dim);
      }

      .sparkle-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent);
      }

      .header-right {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .btn {
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn:hover {
        background: var(--bg);
        border-color: #cbd5e1;
      }

      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      /* Editor & Preview Area */
      .content-area {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      .editor-pane {
        width: 400px;
        min-width: 200px;
        max-width: 800px;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .resizer {
        width: 4px;
        cursor: col-resize;
        background: var(--border);
        transition: background 0.2s;
        z-index: 50;
      }

      .resizer:hover, .resizer.dragging {
        background: var(--accent);
      }

      .pane-header {
        padding: 12px 20px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-dim);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #code {
        flex: 1;
        width: 100%;
        padding: 20px;
        background: var(--surface);
        color: #1e293b;
        font-family: 'Fira Code', 'Cascadia Code', monospace;
        font-size: 13px;
        line-height: 1.6;
        border: none;
        outline: none;
        resize: none;
        tab-size: 2;
      }

      .preview-pane {
        flex: 1;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .preview-container {
        flex: 1;
        overflow: hidden;
        position: relative;
        background-color: #f1f5f9;
        background-image: radial-gradient(rgba(100, 116, 139, 0.18) 1px, transparent 1px);
        background-size: 30px 30px;
      }

      #dynamicDiagram {
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      #dynamicDiagram:active {
        cursor: grabbing;
      }

      .zoom-controls {
        position: absolute;
        bottom: 24px;
        right: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 30;
      }

      .zoom-btn {
        width: 36px;
        height: 36px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.2rem;
        transition: all 0.2s;
        box-shadow: 0 2px 8px rgba(15,23,42,0.1);
      }

      .zoom-btn:hover {
        background: var(--bg);
        border-color: #cbd5e1;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        margin-right: 6px;
      }

      @media (max-width: 1024px) {
        .editor-pane { width: 300px; }
        .ai-prompt-container { margin: 0 10px; }
      }

      @media (max-width: 768px) {
        .content-area { flex-direction: column; }
        .editor-pane { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--border); }
        .menu-toggle { display: block; }
        aside { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
        aside.open { transform: translateX(0); }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  </head>
  <body>
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo-circle">M</div>
        <h2>Mermaid AI</h2>
      </div>
      
      <div class="nav-section">
        <div class="nav-label">Diagram Types</div>
      </div>
      
      <div class="examples-list" id="examples-list">
        <!-- Links populated here -->
      </div>

      <div style="margin-top: auto; padding: 20px; border-top: 1px solid var(--border);">
        <a href="https://mermaid.js.org" target="_blank" class="example-item">Documentation</a>
        <a href="https://mermaid.live" target="_blank" class="example-item">Live Editor</a>
      </div>
    </aside>

    <main>
      <header>
        <div class="header-left">
          <button class="menu-toggle" id="toggle-sidebar">☰</button>
          <div style="font-weight: 600; font-size: 0.95rem; color: var(--text);">Playground</div>
        </div>

        <div class="ai-prompt-container">
          <span class="sparkle-icon">✨</span>
          <input type="text" class="ai-prompt-input" placeholder="Describe a diagram (e.g., 'A login flowchart')" id="ai-prompt" />
        </div>

        <div class="header-right">
          <button class="btn" id="download-svg">Download SVG</button>
          <button class="btn" id="clear-code">Clear</button>
          <button class="btn btn-primary" id="copy-code">Copy</button>
        </div>
      </header>

      <div class="content-area">
        <div class="editor-pane" id="editor-pane">
          <div class="pane-header">
            <span>Editor</span>
            <div style="display: flex; align-items: center;">
              <div class="status-dot" id="status-dot"></div>
              <span id="status-text">Live</span>
            </div>
          </div>
          <textarea id="code" spellcheck="false">graph TD
  A[Prompt AI] -->|Natural Language| B(Mermaid Code)
  B --> C{Visual Output}
  C -->|Fast| D[SVG Diagram]
  C -->|Clean| E[Light Theme]</textarea>
        </div>

        <div class="resizer" id="resizer"></div>
        
        <div class="preview-pane">
          <div class="pane-header">
            <span>Preview</span>
            <span style="font-size: 0.6rem; opacity: 0.6;">Scroll to zoom • Drag to pan</span>
          </div>
          <div class="preview-container">
            <div id="dynamicDiagram"></div>
            <div class="zoom-controls">
              <button class="zoom-btn" id="zoom-in">+</button>
              <button class="zoom-btn" id="zoom-out">−</button>
              <button class="zoom-btn" id="zoom-reset" title="Reset Zoom">⟲</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import mermaid from '/mermaid.esm.mjs';
      import layouts from '/mermaid-layout-elk.esm.mjs';
      
      mermaid.registerLayoutLoaders(layouts);
      
      const editor = document.getElementById('code');
      const preview = document.getElementById('dynamicDiagram');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const aiInput = document.getElementById('ai-prompt');
      let panZoomInstance = null;
      let renderId = 0;

      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        securityLevel: 'loose',
        flowchart: { useMaxWidth: false, htmlLabels: true },
        gantt: { useMaxWidth: false },
        sequence: { useMaxWidth: false },
        themeVariables: {
          background: '#ffffff',
          primaryColor: '#ddd6fe',
          primaryTextColor: '#2d1b69',
          primaryBorderColor: '#a78bfa',
          lineColor: '#94a3b8',
          secondaryColor: '#bae6fd',
          tertiaryColor: '#d1fae5',
          mainBkg: '#ddd6fe',
          nodeBorder: '#a78bfa',
          clusterBkg: '#fef3c7',
          clusterBorder: '#fcd34d',
          titleColor: '#1e1b4b',
          edgeLabelBackground: '#f8fafc',
          attributeBackgroundColorEven: '#f0fdf4',
          attributeBackgroundColorOdd: '#f0f9ff',
          fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, sans-serif',
          fontSize: '14px',
          actorBkg: '#ddd6fe',
          actorBorder: '#a78bfa',
          actorTextColor: '#2d1b69',
          actorLineColor: '#94a3b8',
          signalColor: '#4f46e5',
          signalTextColor: '#1e1b4b',
          labelBoxBkgColor: '#ede9fe',
          labelBoxBorderColor: '#a78bfa',
          labelTextColor: '#2d1b69',
          loopTextColor: '#2d1b69',
          noteBorderColor: '#fcd34d',
          noteBkgColor: '#fef9c3',
          noteTextColor: '#713f12',
          activationBorderColor: '#a78bfa',
          activationBkgColor: '#ede9fe',
          sequenceNumberColor: '#ffffff',
          sectionBkgColor: '#ddd6fe',
          altSectionBkgColor: '#ede9fe',
          sectionBkgColor2: '#bae6fd',
          taskBorderColor: '#a78bfa',
          taskBkgColor: '#ddd6fe',
          taskTextColor: '#2d1b69',
          taskTextOutsideColor: '#2d1b69',
          activeTaskBorderColor: '#4f46e5',
          activeTaskBkgColor: '#c4b5fd',
          gridColor: '#e2e8f0',
          doneTaskBkgColor: '#d1fae5',
          doneTaskBorderColor: '#6ee7b7',
          critBorderColor: '#fca5a5',
          critBkgColor: '#fee2e2',
          todayLineColor: '#f87171',
          pie1: '#ddd6fe',
          pie2: '#bae6fd',
          pie3: '#d1fae5',
          pie4: '#fef3c7',
          pie5: '#fce7f3',
          pie6: '#ccfbf1',
          pie7: '#e0e7ff',
          pie8: '#fef9c3',
          pie9: '#ffe4e6',
          pie10: '#f0fdf4',
          pie11: '#fdf4ff',
          pie12: '#fff7ed',
          pieLegendTextColor: '#1e293b',
          pieSectionTextColor: '#1e293b',
          pieTitleTextColor: '#1e293b',
        }
      });

      async function render(str) {
        if (!str.trim()) {
          preview.innerHTML = '';
          if (panZoomInstance) {
            panZoomInstance.destroy();
            panZoomInstance = null;
          }
          return;
        }

        const thisId = 'mermaid-' + (++renderId);
        let svg;
        try {
          ({ svg } = await mermaid.render(thisId, str));
        } catch (e) {
          console.error(e);
          statusDot.style.background = '#ef4444';
          statusText.textContent = 'Error';
          return;
        }

        preview.innerHTML = svg;

        const svgElement = preview.querySelector('svg');
        svgElement.style.width = '100%';
        svgElement.style.height = '100%';

        if (panZoomInstance) {
          panZoomInstance.destroy();
          panZoomInstance = null;
        }

        try {
          panZoomInstance = svgPanZoom(svgElement, {
            zoomEnabled: true,
            controlIconsEnabled: false,
            fit: true,
            center: true,
            minZoom: 0.1,
            maxZoom: 20,
          });
        } catch (e) {
          console.error('svg-pan-zoom init failed:', e);
        }

        statusDot.style.background = '#10b981';
        statusText.textContent = 'Live';
      }

      function debounce(fn, delay) {
        let timer;
        return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
      }

      // Initial Render
      render(editor.value);

      editor.addEventListener('input', debounce((e) => {
        render(e.target.value);
      }, 300));

      // Zoom Controls
      document.getElementById('zoom-in').onclick = () => panZoomInstance?.zoomIn();
      document.getElementById('zoom-out').onclick = () => panZoomInstance?.zoomOut();
      document.getElementById('zoom-reset').onclick = () => {
        panZoomInstance?.resetZoom();
        panZoomInstance?.center();
      };

      // AI Prompt Mocking
      aiInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const prompt = aiInput.value.toLowerCase();
          aiInput.value = 'Generating...';
          setTimeout(() => {
            let mockCode = 'graph TD\n  Start --> Process\n  Process --> End';
            if (prompt.includes('flow')) mockCode = 'graph LR\n  Step1 --> Step2\n  Step2 --> Step3';
            if (prompt.includes('class')) mockCode = 'classDiagram\n  Animal <|-- Duck\n  Animal : +int age\n  Animal : +is_mammal()';
            if (prompt.includes('seq')) mockCode = 'sequenceDiagram\n  Alice->>Bob: Hello Bob, how are you?\n  Bob-->>Alice: Jolly good!';
            
            editor.value = mockCode;
            render(mockCode);
            aiInput.value = '';
          }, 800);
        }
      });

      // Populate Examples
      const examples = [
        { name: 'Flowchart', code: 'graph TD\n  A[Start] --> B{Is it AI?}\n  B -- Yes --> C[Great!]\n  B -- No --> D[Still good!]' },
        { name: 'Sequence', code: 'sequenceDiagram\n  User->>AI: Generate Chart\n  AI-->>User: Here it is!' },
        { name: 'Class Diagram', code: 'classDiagram\n  class System {\n    +String status\n    +render()\n  }' },
        { name: 'State Diagram', code: 'stateDiagram-v2\n  [*] --> Idle\n  Idle --> Processing\n  Processing --> [*]' },
        { name: 'ER Diagram', code: 'erDiagram\n  USER ||--o{ POST : writes' },
        { name: 'Gantt', code: 'gantt\n  title Mermaid AI Dev\n  Development :a1, 2023-01-01, 30d' }
      ];

      const listContainer = document.getElementById('examples-list');
      examples.forEach(ex => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'example-item';
        a.textContent = ex.name;
        a.onclick = (e) => {
          e.preventDefault();
          editor.value = ex.code;
          render(ex.code);
          document.querySelectorAll('.example-item').forEach(i => i.classList.remove('active'));
          a.classList.add('active');
        };
        listContainer.appendChild(a);
      });

      // Copy Code
      document.getElementById('copy-code').addEventListener('click', () => {
        navigator.clipboard.writeText(editor.value).then(() => {
          const btn = document.getElementById('copy-code');
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 2000);
        });
      });

      // Clear
      document.getElementById('clear-code').addEventListener('click', () => {
        editor.value = '';
        render('');
      });

      // Download Logic
      document.getElementById('download-svg').addEventListener('click', async () => {
        const code = editor.value.trim();
        if (!code) return;

        let svgString;
        try {
          const { svg } = await mermaid.render('mermaid-export', code);
          svgString = svg;
        } catch (e) {
          console.error('Export failed: could not render diagram:', e);
          return;
        }

        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'mermaid-diagram.svg';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      });

      // Panel Resizer Logic
      const resizer = document.getElementById('resizer');
      const editorPane = document.getElementById('editor-pane');
      let isResizing = false;

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const newWidth = e.clientX - resizer.parentElement.getBoundingClientRect().left;
        if (newWidth > 200 && newWidth < 800) {
          editorPane.style.width = `${newWidth}px`;
          if (panZoomInstance) {
            panZoomInstance.resize();
            panZoomInstance.fit();
            panZoomInstance.center();
          }
        }
      });

      window.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('dragging');
          document.body.style.cursor = 'default';
          document.body.style.userSelect = 'auto';
        }
      });

      // Sidebar Toggle
      const sidebar = document.getElementById('sidebar');
      document.getElementById('toggle-sidebar').addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });
    </script>
    <script src="/dev/reload.js"></script>
  </body>
</html>
